name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check and test
        run: |
          node --check fumble-switch.js
          node tests/range-integration.cjs
      - name: Validate and package
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const m = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          assert.equal(m.version, process.env.GITHUB_REF_NAME.slice(1));
          assert.equal(m.id, 'fumble-switch');
          assert.equal(m.manifest, undefined);
          assert.equal(m.download, undefined);
          for (const p of [...m.esmodules, ...m.styles, ...m.languages.map(l => l.path), 'range.js', 'fumble-switch.lock', 'LICENSE']) assert.ok(fs.existsSync(p), p);
          for (const l of m.languages) JSON.parse(fs.readFileSync(l.path, 'utf8'));
          NODE
          mkdir -p dist/package
          cp module.json fumble-switch.js range.js fumble-switch.css fumble-switch.lock LICENSE README.md dist/package/
          cp -r lang templates dist/package/
          (cd dist/package && zip -r ../fumble-switch.zip .)
          cp module.json dist/module.json
          unzip -l dist/fumble-switch.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/fumble-switch.zip dist/module.json \
            --title "$GITHUB_REF_NAME" \
            --notes-file ".github/release-notes-${GITHUB_REF_NAME#v}.md"
